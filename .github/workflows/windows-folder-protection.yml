name: Windows folder protection
on:
  push:
    paths:
      - 'FaceGate/**'
      - '.github/workflows/windows-folder-protection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-commands:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FaceGate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Windows dependencies
        run: python -m pip install cryptography pywin32
      - name: Test real NTFS, CMD and PowerShell access
        run: python -u run_windows_validation.py
  windows-app-catalog:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: FaceGate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install psutil
      - name: Compare catalog with the actual Windows Start entries
        run: python -u run_app_validation.py
