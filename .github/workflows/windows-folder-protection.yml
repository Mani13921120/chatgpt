name: Windows folder protection
on:
  push:
    paths:
      - 'FaceGate/**'
      - '.github/workflows/windows-folder-protection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-commands:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FaceGate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cryptography
        run: python -m pip install cryptography
      - name: Test real NTFS, CMD and PowerShell access
        run: python -u run_windows_validation.py
